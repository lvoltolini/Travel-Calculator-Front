<div class="container mt-5">
  <div class="card shadow">
    <div class="card-body">
      <h2 class="card-title mb-4">Password Generator</h2>

      <!-- Configuration Section -->
      <div class="config-section mb-4">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Password Length: <strong>{{ config.length }}</strong></label>
            <input
              type="range"
              class="form-range"
              min="8"
              max="128"
              [(ngModel)]="config.length"
              (change)="generatePassword()"
            />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="uppercase"
                [(ngModel)]="config.uppercase"
                (change)="generatePassword()"
              />
              <label class="form-check-label" for="uppercase">
                Uppercase (A-Z)
              </label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="lowercase"
                [(ngModel)]="config.lowercase"
                (change)="generatePassword()"
              />
              <label class="form-check-label" for="lowercase">
                Lowercase (a-z)
              </label>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="numbers"
                [(ngModel)]="config.numbers"
                (change)="generatePassword()"
              />
              <label class="form-check-label" for="numbers">
                Numbers (0-9)
              </label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="special"
                [(ngModel)]="config.specialChars"
                (change)="generatePassword()"
              />
              <label class="form-check-label" for="special">
                Special Characters (!@#$...)
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- Generated Password Section -->
      <div class="password-display mb-4">
        <div class="input-group">
          <input
            type="text"
            class="form-control form-control-lg"
            [value]="password"
            readonly
          />
          <button
            class="btn btn-primary"
            type="button"
            (click)="copyToClipboard()"
            title="Copy to clipboard"
          >
            <i class="bi bi-clipboard"></i> Copy
          </button>
          <button
            class="btn btn-success"
            type="button"
            (click)="generatePassword()"
            title="Generate new password"
          >
            <i class="bi bi-arrow-repeat"></i> Generate
          </button>
          <button
            class="btn btn-info"
            type="button"
            (click)="savePassword()"
            title="Save password"
          >
            <i class="bi bi-bookmark"></i> Save
          </button>
        </div>
      </div>

      <!-- Saved Passwords Section -->
      <div class="saved-section" *ngIf="savedPasswords.length > 0">
        <h5 class="mb-3">
          Saved Passwords ({{ savedPasswords.length }})
        </h5>
        <div class="saved-passwords-list">
          <div
            class="saved-password-item d-flex justify-content-between align-items-center mb-2"
            *ngFor="let pwd of savedPasswords"
          >
            <code class="password-text">{{ pwd }}</code>
            <div class="btn-group btn-group-sm" role="group">
              <button
                class="btn btn-outline-primary"
                type="button"
                (click)="copySavedPassword(pwd)"
                title="Copy password"
              >
                <i class="bi bi-clipboard"></i>
              </button>
              <button
                class="btn btn-outline-danger"
                type="button"
                (click)="deleteSavedPassword(pwd)"
                title="Delete password"
              >
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
        <button
          class="btn btn-sm btn-outline-danger mt-3"
          (click)="clearAll()"
        >
          Clear All Passwords
        </button>
      </div>

      <div class="alert alert-info mt-3" *ngIf="savedPasswords.length === 0">
        <i class="bi bi-info-circle"></i>
        Saved passwords will appear here. They are stored in your browser's local storage.
      </div>
    </div>
  </div>
</div>
